# k8s/06-hpa.yaml
# 数据流转：HPA 控制器每隔 15 秒拉取一次 Pod 的 CPU 指标，动态调整 Deployment 的 replicas 数量
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ops-agent-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ops-agent      # 数据流转：告诉 HPA 去监控并操作哪个 Deployment
  minReplicas: 1         # 数据流转：哪怕没请求，也保留 1 个 Pod 处理突发告警
  maxReplicas: 5         # 数据流转：最高扩容到 5 个 Pod，防止节点资源被彻底耗尽
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 50   # 数据流转：核心阈值！当 Pod 平均 CPU 使用率超过 50% 时触发扩容
  behavior:              # 数据流转：扩缩容的节流策略（防止抖动）
    scaleUp:
      stabilizationWindowSeconds: 0  # 数据流转：缩容时，指标超阈值立刻扩容
    scaleDown:
      stabilizationWindowSeconds: 300 # 数据流转：缩容时，观察 5 分钟，如果指标一直低于阈值才缩容，防止流量突刺