# 📄 位置：ops-agent-manifests/argo-app.yaml
# 数据流转：ArgoCD 读取此文件，绑定 Git 仓库路径与 K8s 目标状态
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ops-agent
  namespace: argocd
spec:
  project: default
  source:
    # 替换为你自己的本地 Git 仓库地址或 GitHub 地址
    repoURL: 'https://github.com/linjie0000/ops-agent-manifests.git' 
    targetRevision: HEAD
    path: k8s               # 监听 k8s 文件夹
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    automated:
      prune: true           # 如果 Git 里删除了 04-rbac.yaml，K8s 里对应的资源也自动清理
      selfHeal: true        # 核心：如果有人手动 kubectl edit 修改了线上配置，自动覆盖恢复
    syncOptions:
      - CreateNamespace=true