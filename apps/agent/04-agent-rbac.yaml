# k8s/04-agent-rbac.yaml
# 数据流转：授予 Agent 只读（get/list/watch）Pod 和 Node 的权限
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ops-agent-sa
---
apiVersion: rbac.authorization.k8s.io/v1  #API 版本，RBAC 固定用这个
kind: ClusterRole  #资源类型：集群级"角色"（作用域是整个集群）
metadata:
  name: ops-agent-read-only
rules:   #规则列表，每条 = "哪组 API 的哪些资源，允许哪些动作"
- apiGroups: [""]  #API 组："" 代表核心组（v1，即 pods/nodes/services）
  resources: ["pods", "nodes", "services", "endpoints"]  #具体资源，复数形式
  verbs: ["get", "list", "watch"] # 允许的动作，只有读 数据流转：只允许读，不允许 delete/create，保护集群安全
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding  #绑定对象：把上面那个 ClusterRole 授给某些"主体"
metadata:
  name: ops-agent-binding
subjects:     #被授权的主体列表，可以写多个
- kind: ServiceAccount  #主体类型：ServiceAccount（也可以是 User / Group）
  name: ops-agent-sa   #SA 的名字
  namespace: default   #SA 所在 namespace，SA 必须带 namespace（User 不带）
roleRef:
  kind: ClusterRole
  name: ops-agent-read-only
  apiGroup: rbac.authorization.k8s.io