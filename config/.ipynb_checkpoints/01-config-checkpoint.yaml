# k8s/01-config.yaml
# 数据流转：将配置项以键值对形式注入到 Pod 的环境变量中，应用启动时读取
apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-config
  namespace: default
data:
  OLLAMA_BASE_URL: "http://ollama-svc:11434/v1"  # 数据流转：Agent 调用 Ollama 的 K8s 内部 Service 域名
  RAG_BASE_URL: "http://rag-svc:8100"            # 数据流转：Agent 调用 RAG 服务的域名
  LLM_MODEL: "qwen2.5"
  AGENT_MAX_STEPS: "8"
  LOG_LEVEL: "INFO"